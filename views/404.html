<!-- Custom 404 - Cocok untuk AJAX load -->
<div class="text-center p-4">
    <h1 class="t404">404</h1>
    <p class="info">Oops! Halaman ini belum tersedia atau sedang dalam perbaikan.</p>
</div>

<!-- CSS Khusus 404 -->
<style>
    .t404 {
        font-size: 12rem;
        color: #ff6b6b;
        animation: pulse 2s infinite;
        font-weight: bold;
    }

    .info {
        font-size: 1.2rem;
        color: #6c757d;
    }

    @keyframes pulse {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.7; }
        100% { transform: scale(1); opacity: 1; }
    }
    @media(max-width: 576px){
      .t404 {
        font-size: 6rem;
    }  
    }
</style>
